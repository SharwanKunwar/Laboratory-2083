spring:
  application:
    name: AuthPracticeBackend

  datasource:
    url: jdbc:postgresql://localhost:5432/practice_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        formate_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

