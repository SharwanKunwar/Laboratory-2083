server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #    hikari:
  #      pool-name: QuoteSharePool
  #      maximum-pool-size: 10
  #      minimum-idle: 5
  #      connection-timeout: 30000
  #      idle-timeout: 600000
  #      max-lifetime: 1800000
  #      validation-timeout: 5000
  #      leak-detection-threshold: 0
  #      initialization-fail-timeout: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    secret: 7WwP5U5yV5zQvV0GqPzv4jL6x2QJ9w7H8L9dE5bF2sA9LmNxQeRtYuIoPaSdFgHjKlZxCvBnM
    issuer: AuthBackendApplication
    access-ttl-seconds: 900         # 15 minutes
    refresh-ttl-seconds: 604800     # 7 days
    refresh-token-cookie-name: refresh_token
    cookie-secure: true            # true in production (HTTPS)
    cookie-http-only: true
    cookie-same-site: Lax