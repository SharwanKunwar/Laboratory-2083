# This configuration related to development phase
server:
  port: 8081

spring:
  application:
    name: QuoteBackend

  datasource:
    url: jdbc:postgresql://localhost:5432/practice_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true