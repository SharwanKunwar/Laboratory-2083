<!DOCTYPE html>
<html>

<head>
    <title>Document</title>
</head>

<body>
    <script>
        function factorial(num) {
            if (num === 0 || num === 1) return 1;
            return num * factorial(num - 1);
        }

        let n = 5;
        document.write(n + " factorial is : " + factorial(n));
    </script>
</body>

</html>
