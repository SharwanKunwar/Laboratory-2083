<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>

    <body>
        <h2>Calculator</h2>
        <input type="number" id="num1" placeholder="Enter value of num1: "><br>
        <input type="number" id="num2" placeholder="Enter value of num2: "><br>
        <select id="operation">
            <option value="add">Add</option>
            <option value="sub">Subtract</option>
            <option value="mul">Multiply</option>
            <option value="div">Divide</option>
        </select>
        <br><br>
        <button onclick="calculate()">Calculate</button>
        <p id="result"></p>

        <script>
            function calculate(){
                let a = parseFloat(document.getElementById("num1").value);
                let b = parseFloat(document.getElementById("num2").value);
                let op = document.getElementById("operation").value;
                let displayBox = document.getElementById("result");
                let result;

                if(isNaN(a) || isNaN(b)) return displayBox.innerText="please enter valid input";
                
                switch(op){
                    case "add":
                        result = a+b;
                        break;
                    case "sub":
                        result = a-b;
                        break;
                    case "mul":
                        result = a*b;
                        break;
                    case "div":
                        if(b === 0) return displayBox.innerText="Cannot divide by zero";
                        result = a/b;
                        break
                    default:
                        displayBox.innerText = "invalid input";
                }
                displayBox.innerText = "result is : "+result;

            }
        </script>
    </body>
</html>
