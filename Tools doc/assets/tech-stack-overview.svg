<svg viewBox="0 0 940 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="720" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Recommended Tech Stack</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#64748b">A complete, production-style stack for a Spring Boot project</text>

  <!-- Card template repeated -->
  <!-- Row 1 -->
  <g>
    <rect x="30" y="80" width="280" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="110" font-size="15" font-weight="700" fill="#1e3a8a">Frontend</text>
    <text x="50" y="136" font-size="12" fill="#1e40af">• React</text>
    <text x="50" y="158" font-size="12" fill="#1e40af">• Vite</text>
    <text x="50" y="180" font-size="12" fill="#1e40af">• TypeScript</text>
    <text x="50" y="202" font-size="12" fill="#1e40af">• Tailwind CSS</text>
  </g>

  <g>
    <rect x="330" y="80" width="280" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="110" font-size="15" font-weight="700" fill="#14532d">Backend</text>
    <text x="350" y="136" font-size="12" fill="#166534">• Spring Boot 4.0 / 4.1</text>
    <text x="350" y="158" font-size="12" fill="#166534">• Java 21 LTS (or newer)</text>
    <text x="350" y="180" font-size="12" fill="#166534">• Spring Web, Validation</text>
    <text x="350" y="202" font-size="12" fill="#166534">• Spring Data JPA</text>
  </g>

  <g>
    <rect x="630" y="80" width="280" height="180" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="650" y="110" font-size="15" font-weight="700" fill="#831843">Database</text>
    <text x="650" y="136" font-size="12" fill="#9d174d">• PostgreSQL</text>
    <text x="650" y="158" font-size="12" fill="#9d174d">• Hibernate / JPA ORM</text>
    <text x="650" y="180" font-size="12" fill="#9d174d">• Flyway / Liquibase</text>
    <text x="650" y="202" font-size="12" fill="#9d174d">  (schema migrations)</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="30" y="290" width="280" height="180" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="50" y="320" font-size="15" font-weight="700" fill="#5b21b6">Authentication</text>
    <text x="50" y="346" font-size="12" fill="#5b21b6">• Spring Security</text>
    <text x="50" y="368" font-size="12" fill="#5b21b6">• JWT</text>
    <text x="50" y="390" font-size="12" fill="#5b21b6">• OAuth2 Client (optional)</text>
  </g>

  <g>
    <rect x="330" y="290" width="280" height="180" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="350" y="320" font-size="15" font-weight="700" fill="#9a3412">API Documentation</text>
    <text x="350" y="346" font-size="12" fill="#9a3412">• OpenAPI Specification</text>
    <text x="350" y="368" font-size="12" fill="#9a3412">• Swagger UI</text>
  </g>

  <g>
    <rect x="630" y="290" width="280" height="180" rx="12" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="650" y="320" font-size="15" font-weight="700" fill="#155e75">Build Tool</text>
    <text x="650" y="346" font-size="12" fill="#155e75">• Maven</text>
    <text x="650" y="368" font-size="12" fill="#155e75">• Spring Boot Maven Plugin</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="30" y="500" width="280" height="180" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="530" font-size="15" font-weight="700" fill="#7f1d1d">Version Control</text>
    <text x="50" y="556" font-size="12" fill="#991b1b">• Git</text>
    <text x="50" y="578" font-size="12" fill="#991b1b">• GitHub</text>
  </g>

  <g>
    <rect x="330" y="500" width="280" height="180" rx="12" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="350" y="530" font-size="15" font-weight="700" fill="#134e4a">Containerization</text>
    <text x="350" y="556" font-size="12" fill="#115e59">• Docker</text>
    <text x="350" y="578" font-size="12" fill="#115e59">• Docker Compose</text>
  </g>

  <g>
    <rect x="630" y="500" width="280" height="180" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="650" y="530" font-size="15" font-weight="700" fill="#312e81">Deployment</text>
    <text x="650" y="556" font-size="12" fill="#3730a3">• Render</text>
    <text x="650" y="578" font-size="12" fill="#3730a3">• Railway</text>
    <text x="650" y="600" font-size="12" fill="#3730a3">• VPS</text>
    <text x="650" y="622" font-size="12" fill="#3730a3">• Docker (self-hosted)</text>
  </g>
</svg>
